<nav class="navbar">
  
  <div class="navbar__div navbar__left">
    <!-- <button (click)="onClick()" class="navbar__btn" [class.navbar__btn--open]="open">
      <span class="material-symbols-outlined navbar__icon" [class.navbar__icon--open]="open">menu</span>  
    </button> -->
    <span class="navbar__div navbar__app-name">Thesis</span>
  </div>
  <div class="navbar__div navbar__center">
    <app-dropdown class="course-selector" align="center" *ngIf="showCourseSwitcher">
      <span dropdownTrigger class="course-selector__text">
        {{ selectedCourse?.name ?? 'Aucun parcours actif' }}
        <span class="material-symbols-outlined course-selector__chevron">expand_more</span>
      </span>
      <ng-container dropdownPanel>
        <div
          class="dropdown-item"
          [class.dropdown-item--active]="course.id === selectedCourse?.id"
          *ngFor="let course of courses"
          (click)="selectCourse(course)"
        >
          {{ course.name }}
        </div>
        <div class="dropdown-empty" *ngIf="courses.length === 0">
          Aucun parcours actif
        </div>
      </ng-container>
    </app-dropdown>
  </div>
  <div class="navbar__div navbar__right">
    <app-dropdown align="right">
      <span dropdownTrigger class="navbar__profile">{{ initials }}</span>
      <ng-container dropdownPanel>
        <div class="navbar__profile-name">{{ user?.firstname }} {{ user?.surname }}</div>
        <div class="dropdown-item" (click)="logout()">Se déconnecter</div>
      </ng-container>
    </app-dropdown>
  </div>
</nav>
