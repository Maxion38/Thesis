@if(workData$ | async; as work) {

  <div class="page">

  <div class="description">

    <div class="description__toolbar">
      <button
        class="toolbar__btn"
        [class.active]="displayMode === 'original'"
        (click)="chooseDisplayMode('original')">
        Original
      </button>

      <div class="toolbar__edit-group">
        <button
          class="toolbar__edit-group__btn"
          [class.active]="displayMode === 'edit'"
          (click)="chooseDisplayMode('edit')">
          Modifier
        </button>

        <button
          *ngIf="isEditing"
          class="toolbar__edit-group__btn"
          [class.active]="displayMode === 'preview'"
          (click)="chooseDisplayMode('preview')">
          Aperçu
        </button>
      </div>

      <div *ngIf="isEditing" class="toolbar__actions">
        <span class="material-symbols-outlined toolbar__action-btn" (click)="saveEdit()">check</span>
        <span class="material-symbols-outlined toolbar__action-btn" (click)="cancelEdit()">undo</span>
      </div>
    </div>

    <div class="description__body" [class.description__body--editing]="displayMode === 'edit'">
      <app-markdown-card
        *ngIf="displayMode === 'original'"
        [markdown]="initialMarkdown">
      </app-markdown-card>

      <textarea
        *ngIf="displayMode === 'edit'"
        class="description__editor"
        [(ngModel)]="markdown"
        (ngModelChange)="onTextChange()">
      </textarea>

      <app-markdown-card
        *ngIf="displayMode === 'preview'"
        [markdown]="markdown">
      </app-markdown-card>
    </div>

  </div>

  <app-date-picker
    title="Date de remise"
    [date]="work.dueDate"
    (chosedDate)="onDateChosed($event)">
  </app-date-picker>

</div>

}
