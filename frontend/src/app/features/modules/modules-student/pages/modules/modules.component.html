<div class="page">

  <div>
    <div class="title">

      <app-dropdown class="title__dropdown">
        <span dropdownTrigger class="title__label">
          {{ selectedTaskFilterLabel }}
          <span class="material-symbols-outlined dropdown-icon">stat_minus_1</span>
        </span>
        <ng-container dropdownPanel>
          <button
            *ngFor="let option of taskFilterOptions"
            class="dropdown-item"
            [class.dropdown-item--active]="option.value === selectedTaskFilter"
            [hidden]="option.value === 'NO_DATE' && noDateCards.length === 0"
            (click)="selectedTaskFilter = option.value"
          >{{ option.label }}</button>
        </ng-container>
      </app-dropdown>

    </div>

    <div class="tasks-wrapper">
      <!-- <button class="scroll-arrow scroll-arrow--right" *ngIf="canScrollRight" (click)="scrollRight()">›</button> -->
      <div class="tasks-section" #tasksSection (scroll)="onScrollT()">

        <app-student-module-card
          *ngFor="let card of filteredCards"
          class="module-card"
          [card]="card"
          (ctaClicked)="onModuleCardAction($event)"
        >
        </app-student-module-card>

        <div class="empty-state" *ngIf="filteredCards.length === 0">
          <span class="material-symbols-outlined empty-state__icon">check_circle</span>
          <span class="empty-state__text">Vous êtes à jour</span>
        </div>

      </div>
    </div>

  </div>

  <div>
    <div class="title">
      <span class="title__label">Modules</span>
    </div>

    <div class="tasks-wrapper">
      <div class="tasks-section modules-section" #modulesSection>

        <app-simple-module-card
          *ngFor="let module of modules"
          class="module-card"
          [module]="module"
        >
        </app-simple-module-card>

      </div>
    </div>

  </div>

</div>
